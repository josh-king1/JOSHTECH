<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>JoshTech Stopwatch</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<style>
:root{
    --bg:#0a0a0a;
    --card:rgba(255,255,255,.06);
    --text:#ffffff;
    --muted:#cbd5e1;
    --line:rgba(255,255,255,.08);
    --primary:#00d9ff;
}

body.light{
    --bg:#f5f7fa;
    --card:rgba(255,255,255,.9);
    --text:#111827;
    --muted:#475569;
    --line:rgba(0,0,0,.08);
    --primary:#0d6efd;
}

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    background:var(--bg);
    color:var(--text);
    font-family:Segoe UI,sans-serif;
    min-height:100vh;
    overflow:hidden;
    transition:.4s ease;
}

/* BACKGROUND */
.bg{
    position:fixed;
    inset:0;
    z-index:-3;
}

.blob{
    position:absolute;
    border-radius:50%;
    filter:blur(70px);
    opacity:.6;
    animation:float 14s infinite ease-in-out alternate;
}

.b1{width:260px;height:260px;background:#00d9ff;top:5%;left:5%;}
.b2{width:240px;height:240px;background:#7c3aed;top:20%;right:8%;animation-delay:2s;}
.b3{width:260px;height:260px;background:#00ff95;bottom:8%;left:18%;animation-delay:4s;}
.b4{width:220px;height:220px;background:#ff008c;bottom:10%;right:10%;animation-delay:1s;}

.overlay{
    position:absolute;
    inset:0;
    background:rgba(0,0,0,.55);
}

body.light .overlay{
    background:rgba(255,255,255,.35);
}

/* CARD */
.main-card{
    background:var(--card);
    border:1px solid var(--line);
    backdrop-filter:blur(18px);
    border-radius:28px;
    box-shadow:0 25px 60px rgba(0,0,0,.35);
}

.brand{
    font-size:1.6rem;
    font-weight:900;
}

.brand span{
    color:var(--primary);
}

/* CLOCK */
.live-time{
    font-size:2rem;
    font-weight:800;
    color:var(--primary);
}

.live-date{
    color:var(--muted);
}

/* STOPWATCH */
.watch{
    font-size:3rem;
    font-weight:900;
    letter-spacing:2px;
}

/* TOGGLE */
.switch{
    width:60px;
    height:32px;
    background:var(--line);
    border-radius:50px;
    position:relative;
    cursor:pointer;
}

.knob{
    width:26px;
    height:26px;
    background:var(--primary);
    border-radius:50%;
    position:absolute;
    top:3px;
    left:3px;
    transition:.3s;
}

body.light .knob{
    transform:translateX(28px);
}

/* BUTTONS */
.btnx{
    padding:13px;
    border:none;
    border-radius:14px;
    font-weight:700;
    transition:.3s;
}

.btnx:hover{
    transform:translateY(-3px);
}

.start{background:#16a34a;color:#fff;}
.pause{background:#f59e0b;color:#fff;}
.reset{background:#ef4444;color:#fff;}

/* ANIMATION */
@keyframes float{
    0%{transform:translate(0,0) scale(1);}
    50%{transform:translate(30px,-40px) scale(1.1);}
    100%{transform:translate(-25px,30px) scale(.95);}
}

/* RESPONSIVE */
@media(max-width:576px){
    .watch{font-size:2.2rem;}
    .live-time{font-size:1.4rem;}
}
</style>
</head>

<body>

<div class="bg">
    <div class="blob b1"></div>
    <div class="blob b2"></div>
    <div class="blob b3"></div>
    <div class="blob b4"></div>
    <div class="overlay"></div>
</div>

<div class="container min-vh-100 d-flex justify-content-center align-items-center py-4">
<div class="row justify-content-center w-100">
<div class="col-12 col-md-8 col-lg-5">

<div class="main-card p-4 p-md-5">

    <!-- HEADER -->
    <div class="d-flex justify-content-between align-items-center mb-4">
        <div class="brand">JOSH<span>TECH</span></div>

        <div class="switch" onclick="toggleTheme()">
            <div class="knob"></div>
        </div>
    </div>

    <!-- CLOCK -->
    <div class="text-center mb-4">
        <div id="liveTime" class="live-time">00:00:00</div>
        <div id="liveDate" class="live-date">Loading...</div>
    </div>

    <!-- STOPWATCH -->
    <div class="text-center p-4" style="background:rgba(255,255,255,.03); border-radius:20px;">
        <div id="display" class="watch mb-4">00:00:00:00</div>

        <div class="row g-3">
            <div class="col-12 col-md-4">
                <button class="btnx start w-100" onclick="startWatch()">Start</button>
            </div>
            <div class="col-12 col-md-4">
                <button class="btnx pause w-100" onclick="pauseWatch()">Stop</button>
            </div>
            <div class="col-12 col-md-4">
                <button class="btnx reset w-100" onclick="resetWatch()">Reset</button>
            </div>
        </div>
    </div>

</div>

</div>
</div>
</div>

<script>

/* THEME */
function toggleTheme(){
    document.body.classList.toggle("light");
}

/* CLOCK */
function updateClock(){
    const now = new Date();
    document.getElementById("liveTime").innerText = now.toLocaleTimeString();
    document.getElementById("liveDate").innerText = now.toDateString();
}
setInterval(updateClock,1000);
updateClock();

/* STOPWATCH (FIXED ACCURATE VERSION) */
let h=0,m=0,s=0,ms=0;
let timer=null;

function show(){
    document.getElementById("display").innerText =
    String(h).padStart(2,'0') + ":" +
    String(m).padStart(2,'0') + ":" +
    String(s).padStart(2,'0') + ":" +
    String(ms).padStart(2,'0');
}

function run(){
    ms += 10;

    if(ms === 100){
        ms = 0;
        s++;
    }

    if(s === 60){
        s = 0;
        m++;
    }

    if(m === 60){
        m = 0;
        h++;
    }

    show();
}

function startWatch(){
    if(timer) return;
    timer = setInterval(run,10);
}

function pauseWatch(){
    clearInterval(timer);
    timer = null;
}

function resetWatch(){
    clearInterval(timer);
    timer = null;
    h=m=s=ms=0;
    show();
}

show();
</script>

</body>
</html>
