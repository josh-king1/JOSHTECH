<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Classic Medical UI</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>

<body>

<canvas id="bg"></canvas>

<div class="container-fluid vh-100 d-flex justify-content-center align-items-center">

    <div class="row justify-content-center w-100">
        <div class="col-lg-5 col-md-7 col-11">

            <div class="card medical-card shadow-lg border-0 text-center p-4 p-md-5">
                
                <h1 class="fw-bold text-primary mb-3">
                    Medical System
                </h1>

                <p class="text-muted mb-4">
                    Reliable healthcare and pharmaceutical management platform
                </p>

                <div class="d-flex justify-content-center gap-3 flex-wrap">
                    <button class="btn btn-primary px-4 rounded-pill">
                        Login
                    </button>

                    <button class="btn btn-outline-primary px-4 rounded-pill">
                        Register
                    </button>
                </div>

            </div>

        </div>
    </div>

<script src="script.js"></script>

</html>
