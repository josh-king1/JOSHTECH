<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Magic Nav with Theme Toggle</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <button class="theme-switch" id="theme-toggle">
        <ion-icon name="moon-outline" id="theme-icon"></ion-icon>
    </button>

    <div class="page-container">
        <div id="home" class="content-page active">
            <div class="page-icon-wrapper"><ion-icon name="home"></ion-icon></div>
            <h2>Home Feed</h2>
            <p class="text-secondary">Welcome to your dashboard.</p>
        </div>
        <div id="profile" class="content-page">
            <div class="page-icon-wrapper"><ion-icon name="person"></ion-icon></div>
            <h2>My Profile</h2>
            <p class="text-secondary">Akawe Joshua Ifechukwusude</p>
        </div>
        <div id="chat" class="content-page">
            <div class="page-icon-wrapper"><ion-icon name="chatbubbles"></ion-icon></div>
            <h2>Messages</h2>
            <p class="text-secondary">No new notifications.</p>
        </div>
        <div id="camera" class="content-page">
            <div class="page-icon-wrapper"><ion-icon name="camera"></ion-icon></div>
            <h2>Studio</h2>
            <p class="text-secondary">View your gallery.</p>
        </div>
        <div id="settings" class="content-page">
            <div class="page-icon-wrapper"><ion-icon name="settings"></ion-icon></div>
            <h2>Settings</h2>
            <p class="text-secondary">Customize your experience.</p>
        </div>
    </div>

    <nav class="navigation">
        <ul>
            <li class="list active" data-target="home"><a href="#"><span class="icon"><ion-icon name="home-outline"></ion-icon></span></a></li>
            <li class="list" data-target="profile"><a href="#"><span class="icon"><ion-icon name="person-outline"></ion-icon></span></a></li>
            <li class="list" data-target="chat"><a href="#"><span class="icon"><ion-icon name="chatbubbles-outline"></ion-icon></span></a></li>
            <li class="list" data-target="camera"><a href="#"><span class="icon"><ion-icon name="camera-outline"></ion-icon></span></a></li>
            <li class="list" data-target="settings"><a href="#"><span class="icon"><ion-icon name="settings-outline"></ion-icon></span></a></li>
            <div class="indicator"></div>
        </ul>
    </nav>
</body>
    <script type="module" src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.esm.js"></script>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="./script.js"></script>
</html>
