<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fast Scramble Text Multi Color</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    background:#0f172a;
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    font-family:Arial, sans-serif;
    overflow:hidden;
}

.container{
    text-align:center;
}

#text{
    font-size:65px;
    font-weight:bold;
    letter-spacing:4px;
    min-height:90px;
    transition:0.3s;
}

button{
    margin-top:30px;
    padding:12px 28px;
    border:none;
    border-radius:8px;
    background:#ffffff;
    color:#111;
    font-size:18px;
    cursor:pointer;
    font-weight:bold;
}

button:hover{
    transform:scale(1.05);
}
</style>
</head>
<body>

<div class="container">
    <div id="text"></div>
    <button onclick="start()">Replay</button>
</div>

<script>
const text = document.getElementById("text");

const words = [
    {word:"WELCOME YOUNG DAV", color:"#38bdf8"},
    {word:"JOSH DAV", color:"#22c55e"},
    {word:"JOSHTECH", color:"#f59e0b"},
    {word:"CREATIVE DEV", color:"#ef4444"},
    {word:"WEB MASTER", color:"#a855f7"}
];

const chars = "ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789@#$%&";

function scrambleWord(finalText,color){

    return new Promise(resolve=>{

        text.style.color = color;

        let frame = 0;
        let max = finalText.length * 3;

        let interval = setInterval(()=>{

            let output = "";

            for(let i=0;i<finalText.length;i++){

                if(i < frame / 3){
                    output += finalText[i];
                }else{
                    output += chars[Math.floor(Math.random()*chars.length)];
                }

            }

            text.innerHTML = output;
            frame++;

            if(frame > max){
                clearInterval(interval);
                text.innerHTML = finalText;
                resolve();
            }

        },20);

    });

}

async function start(){

    for(let item of words){

        await scrambleWord(item.word,item.color);

        await new Promise(r=>setTimeout(r,700));
    }

}

start();
</script>

</body>
</html>
