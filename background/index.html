<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Pro Animal Slider</title>

<!-- Bootstrap -->
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="slider" id="slider">

    <!-- Progress Bar -->
    <div class="progress-bar"></div>

    <div class="slides">

        <div class="slide active">
            <img src="https://images.unsplash.com/photo-1546182990-dffeafbe841d">
            <div class="content">
                <h1>DESIGN</h1>
                <h2>ANIMAL</h2>
                <p>Premium animated slider experience.</p>
            </div>
        </div>

        <div class="slide">
            <img src="https://images.unsplash.com/photo-1618641662184-bafefb91a542">
            <div class="content">
                <h1>WILDLIFE</h1>
                <h2>DEER</h2>
                <p>Smooth transitions and gestures.</p>
            </div>
        </div>

        <div class="slide">
            <img src="https://images.unsplash.com/photo-1518791841217-8f162f1e1131">
            <div class="content">
                <h1>FOREST</h1>
                <h2>ELEPHANT</h2>
                <p>Modern UI/UX design.</p>
            </div>
        </div>

    </div>

    <!-- Bottom Bar -->
    <div class="bottom-bar">

        <div class="controls">
            <button id="prev" class="glass-btn">⟵</button>
            <button id="next" class="glass-btn">⟶</button>
        </div>

        <div class="thumbnails">
            <img src="https://images.unsplash.com/photo-1546182990-dffeafbe841d" class="thumb active">
            <img src="https://images.unsplash.com/photo-1618641662184-bafefb91a542" class="thumb">
            <img src="https://images.unsplash.com/photo-1518791841217-8f162f1e1131" class="thumb">
        </div>

    </div>

</div>

<script src="script.js"></script>
</body>
</html>
