<!DOCTYPE html>
<html lang="en">

<head>

    <title>Document</title>
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;

        }

        button {

<body>
    <h2> JOSHTECH</h2>
    <input type="text" id="text" placeholder="Type Something....">
